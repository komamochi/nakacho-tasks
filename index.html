<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>なかちょタスク</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#f6f3ef">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: マスコットのいる見出し → 木のトレイに並ぶタブ → ふっくらした白い紙の表 */
:root {
  --bg: #f6f3ef;          /* 背景：あたたかい白 */
  --surface: #ffffff;     /* 紙 */
  --surface-2: #f1ece6;   /* くぼみ */
  --line: #ebe5de;
  --ink: #46423f;         /* チャコールグレー */
  --ink-soft: #8f8680;    /* 耳のグレー */
  --wood: #d9a066;        /* 机の木 */
  --wood-deep: #b9783f;
  --wood-soft: #f5e6d3;
  --focus: #d9a066;
  --badge-bg: #b9783f; --badge-fg: #ffffff;
  --tab-line: #e3dcd4; --tab-fg: #6f6762;
  --shadow: 0 14px 30px -18px rgba(90, 60, 30, .35), 0 2px 6px rgba(90, 60, 30, .06);
  --shadow-sm: 0 4px 10px -4px rgba(90, 60, 30, .22), 0 1px 2px rgba(90, 60, 30, .06);
  --c-gray-bg: #ece8e4; --c-gray-fg: #5f5853;
  --c-wood-bg: #f6e3cc; --c-wood-fg: #8a5522;
  --c-sage-bg: #e1ecdf; --c-sage-fg: #3f6640;
  --c-sky-bg:  #dfe9f2; --c-sky-fg:  #36597a;
  --c-rose-bg: #f6e0e0; --c-rose-fg: #8c4545;
  --c-lemon-bg:#f5eecb; --c-lemon-fg:#77661d;
  --font: "Montserrat", "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1e1b19; --surface: #29251f; --surface-2: #322d28; --line: #3d3731;
    --ink: #f2ede7; --ink-soft: #a89e96;
    --wood: #e2ad78; --wood-deep: #ecbd8c; --wood-soft: #47372a; --focus: #e2ad78;
    --badge-bg: #e2ad78; --badge-fg: #2a2118;
    --tab-line: #4a433d; --tab-fg: #c9bfb7;
    --shadow: 0 14px 30px -16px rgba(0,0,0,.7), 0 2px 6px rgba(0,0,0,.3);
    --shadow-sm: 0 4px 10px -4px rgba(0,0,0,.6), 0 1px 2px rgba(0,0,0,.3);
    --c-gray-bg: #3b3632; --c-gray-fg: #d6cec7;
    --c-wood-bg: #4d3826; --c-wood-fg: #f1c99c;
    --c-sage-bg: #2f4030; --c-sage-fg: #b8d6b5;
    --c-sky-bg:  #2b3a48; --c-sky-fg:  #b5cfe6;
    --c-rose-bg: #4a2f2f; --c-rose-fg: #f0bcbc;
    --c-lemon-bg:#45401f; --c-lemon-fg:#e9dc96;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1e1b19; --surface: #29251f; --surface-2: #322d28; --line: #3d3731;
  --ink: #f2ede7; --ink-soft: #a89e96;
  --wood: #e2ad78; --wood-deep: #ecbd8c; --wood-soft: #47372a; --focus: #e2ad78;
    --badge-bg: #e2ad78; --badge-fg: #2a2118;
    --tab-line: #4a433d; --tab-fg: #c9bfb7;
  --shadow: 0 14px 30px -16px rgba(0,0,0,.7), 0 2px 6px rgba(0,0,0,.3);
  --shadow-sm: 0 4px 10px -4px rgba(0,0,0,.6), 0 1px 2px rgba(0,0,0,.3);
  --c-gray-bg: #3b3632; --c-gray-fg: #d6cec7;
  --c-wood-bg: #4d3826; --c-wood-fg: #f1c99c;
  --c-sage-bg: #2f4030; --c-sage-fg: #b8d6b5;
  --c-sky-bg:  #2b3a48; --c-sky-fg:  #b5cfe6;
  --c-rose-bg: #4a2f2f; --c-rose-fg: #f0bcbc;
  --c-lemon-bg:#45401f; --c-lemon-fg:#e9dc96;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { overflow: hidden; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 14px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 62px 24px;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 1240px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

/* ---- 見出し ---- */
.top { --head-h: 128px; position: relative; display: flex; align-items: center; gap: 16px; min-height: 44px; padding-right: 190px; }
.top .grow { flex: 1; min-width: 0; }
.top h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: .02em; line-height: 1.2; }
.mascot { position: absolute; right: 4px; top: calc((var(--head-h) - 172px) / 2 - 24px); width: 172px; pointer-events: none; z-index: 1; }
.mascot img { display: block; width: 100%; }
.saved { margin: 4px 0 0; font-size: 12px; color: var(--c-rose-fg); }

/* ---- タブ ---- */
.tabs {
  position: relative; z-index: 2;
  display: flex; align-items: center; gap: 8px; padding: 4px 2px;
  overflow-x: auto; scrollbar-width: none; max-width: calc(100% - 190px); width: fit-content;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none; display: flex; align-items: center; gap: 6px;
  border: 0; background: var(--surface); border-radius: 999px; box-shadow: inset 0 0 0 1px var(--tab-line);
  padding: 8px 16px; font-weight: 500; color: var(--tab-fg);
  white-space: nowrap; transition: background .15s, color .15s, box-shadow .15s;
}
.tab:hover { color: var(--ink); box-shadow: inset 0 0 0 1px var(--wood); }
.tab.active { background: var(--wood-soft); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--wood); font-weight: 700; }
.tab .count {
  font-size: 11px; font-variant-numeric: tabular-nums; font-weight: 500;
  background: var(--badge-bg); color: var(--badge-fg); font-weight: 700;
  min-width: 20px; height: 20px; display: inline-grid; place-items: center; border-radius: 999px; padding: 0 6px;
}
.tab .more {
  width: 22px; height: 22px; margin-right: -8px; border-radius: 50%; display: grid; place-items: center;
  color: var(--ink-soft); font-size: 14px; line-height: 1;
}
.tab .more:hover { background: var(--surface); color: var(--ink); }
.tab.dragging { opacity: .4; }
.tab.drop-before { box-shadow: inset 3px 0 0 var(--wood); }
.tab-rename {
  border: 0; outline: 2px solid var(--wood); border-radius: 999px; background: var(--surface);
  padding: 8px 14px; width: 9em; font-weight: 700;
}
.add-tab {
  flex: none; width: 34px; height: 34px; border-radius: 50%; border: 0;
  background: transparent; color: var(--ink-soft); font-size: 20px; line-height: 1;
  display: grid; place-items: center;
}
.add-tab:hover { background: var(--surface); color: var(--wood-deep); box-shadow: var(--shadow-sm); }

/* ---- 表 ---- */
.sheet {
  position: relative; z-index: 2;
  background: var(--surface); border-radius: 22px; box-shadow: var(--shadow);
  overflow: hidden; display: flex; flex-direction: column;
  flex: 0 1 auto; min-height: 0;
}
.scroller { overflow: auto; flex: 0 1 auto; min-height: 0; }
.sheet .foot { flex: none; }
.top, .tabs { flex: none; }
table { border-collapse: separate; border-spacing: 0; table-layout: fixed; width: max-content; min-width: 100%; }
th, td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 0; vertical-align: middle; }
th:last-child, td:last-child { border-right: 0; }
thead th {
  position: sticky; top: 0; z-index: 2; background: var(--surface);
  text-align: left; font-weight: 500; color: var(--ink-soft); font-size: 12.5px;
  height: 44px; border-bottom: 1.5px solid var(--line);
}
.col-head {
  width: 100%; height: 44px; border: 0; background: transparent; text-align: left;
  display: flex; align-items: center; gap: 7px; padding: 0 12px; color: inherit;
}
.col-head:hover { background: var(--surface-2); color: var(--ink); }
.col-head .ico { width: 16px; text-align: center; opacity: .75; font-size: 12px; flex: none; }
.col-head .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
th { position: relative; }
.resize { position: absolute; right: -4px; top: 0; bottom: 0; width: 8px; cursor: col-resize; z-index: 3; }
.resize:hover, .resize.on { background: linear-gradient(var(--wood), var(--wood)) center / 2px 100% no-repeat; }
.gutter { width: 46px; text-align: center; color: var(--ink-soft); font-size: 12px; font-variant-numeric: tabular-nums; }
td.gutter { position: relative; }
.row-del {
  position: absolute; inset: 0; margin: auto; width: 24px; height: 24px; border-radius: 50%;
  border: 0; background: var(--surface-2); color: var(--ink-soft); display: none; place-items: center; font-size: 13px;
}
tr:hover .row-del { display: grid; }
tr:hover .row-num { visibility: hidden; }
.row-del:hover { background: var(--c-rose-bg); color: var(--c-rose-fg); }
.add-col-th { width: 52px; }
.add-col {
  width: 100%; height: 44px; border: 0; background: transparent; color: var(--ink-soft); font-size: 18px;
}
.add-col:hover { color: var(--wood-deep); background: var(--surface-2); }
tbody tr:hover td { background: color-mix(in srgb, var(--surface-2) 45%, var(--surface)); }
tbody tr.done td:not(.gutter) .cell-text { color: var(--ink-soft); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--ink-soft) 60%, transparent); }

.cell-text, .cell-date, .cell-num {
  width: 100%; height: 42px; border: 0; background: transparent; padding: 0 12px; outline: none;
}
.cell-num { text-align: right; font-variant-numeric: tabular-nums; }
.cell-date { color: var(--ink); font-variant-numeric: tabular-nums; }
.cell-date:not(.has) { color: var(--ink-soft); }
td:focus-within { box-shadow: inset 0 0 0 2px var(--wood); border-radius: 4px; }
.cell-check { width: 100%; height: 42px; border: 0; background: transparent; display: grid; place-items: center; outline: none; }
.check {
  width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--ink-soft);
  display: grid; place-items: center; transition: all .15s;
}
.cell-check:hover .check { border-color: var(--wood-deep); }
.check.on { background: var(--wood); border-color: var(--wood); }
.check.on::after {
  content: ""; width: 9px; height: 5px; border-left: 2px solid #fff; border-bottom: 2px solid #fff;
  transform: translateY(-1px) rotate(-45deg);
}
.cell-select { width: 100%; height: 42px; border: 0; background: transparent; padding: 0 10px; text-align: left; outline: none; display: flex; align-items: center; }
.empty-dash { color: var(--line); }
.pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 1px 10px; font-size: 12.5px; font-weight: 500; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.pill.gray  { background: var(--c-gray-bg);  color: var(--c-gray-fg); }
.pill.wood  { background: var(--c-wood-bg);  color: var(--c-wood-fg); }
.pill.sage  { background: var(--c-sage-bg);  color: var(--c-sage-fg); }
.pill.sky   { background: var(--c-sky-bg);   color: var(--c-sky-fg); }
.pill.rose  { background: var(--c-rose-bg);  color: var(--c-rose-fg); }
.pill.lemon { background: var(--c-lemon-bg); color: var(--c-lemon-fg); }

.foot { display: flex; align-items: center; gap: 8px; padding: 8px; flex-wrap: wrap; }
.btn-soft {
  border: 0; background: transparent; border-radius: 999px; padding: 7px 14px;
  color: var(--ink-soft); font-weight: 500; display: inline-flex; align-items: center; gap: 6px;
}
.btn-soft:hover { background: var(--surface-2); color: var(--ink); }
.foot .hint { margin-left: auto; color: var(--ink-soft); font-size: 12px; padding-right: 8px; }

.empty-state { padding: 48px 16px; text-align: center; color: var(--ink-soft); }

/* ---- メニュー ---- */
.menu {
  position: fixed; z-index: 50; min-width: 220px; max-width: min(300px, calc(100vw - 24px));
  background: var(--surface); border-radius: 16px; box-shadow: 0 20px 40px -16px rgba(60,40,20,.35), 0 0 0 1px var(--line);
  padding: 6px; display: flex; flex-direction: column; gap: 2px;
  max-height: 70vh; overflow: auto;
}
.menu.compact { min-width: 0; width: max-content; }
.menu .sec { font-size: 11px; color: var(--ink-soft); padding: 8px 10px 2px; letter-spacing: .04em; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; width: auto; }
.mi {
  border: 0; background: transparent; text-align: left; border-radius: 10px; padding: 7px 10px;
  display: flex; align-items: center; gap: 8px; width: 100%;
}
.mi:hover, .mi:focus-visible { background: var(--surface-2); outline: none; }
.mi .ico { width: 18px; text-align: center; color: var(--ink-soft); flex: none; }
.mi.sel { background: var(--wood-soft); }
.mi.danger { color: var(--c-rose-fg); }
.mi.danger .ico { color: inherit; }
.mi.danger.armed { background: var(--c-rose-bg); font-weight: 700; }
.mi .x { margin-left: auto; color: var(--ink-soft); border-radius: 50%; width: 22px; height: 22px; display: grid; place-items: center; }
.mi .x:hover { background: var(--c-rose-bg); color: var(--c-rose-fg); }
.menu input[type="text"] {
  width: 100%; border: 0; background: var(--surface-2); border-radius: 10px; padding: 8px 10px; outline: none;
}
.menu input[type="text"]:focus { box-shadow: inset 0 0 0 2px var(--wood); }
.types { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }

@media (max-width: 560px) {
  body { padding-block: 50px 16px; }
  .top { padding-right: 124px; }
  .mascot { width: 120px; top: calc((var(--head-h) - 120px) / 2 - 16px); }
  .tabs { max-width: calc(100% - 124px); }
  .top h1 { font-size: 22px; }
  .foot .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---- ログイン ---- */
.login { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-left, 0px)); background: var(--bg); z-index: 100; }
.login-card { width: min(360px, 100%); background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); padding: 28px 24px 24px; display: flex; flex-direction: column; gap: 14px; }
.login-card img { width: 120px; align-self: center; margin: -8px 0 -4px; }
.login-card h2 { margin: 0; font-size: 20px; text-align: center; }
.login-card label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--ink-soft); }
.login-card input { border: 0; background: var(--surface-2); border-radius: 12px; padding: 11px 12px; font-size: 15px; outline: none; color: var(--ink); }
.login-card input:focus { box-shadow: inset 0 0 0 2px var(--wood); }
.login-card button { border: 0; border-radius: 999px; padding: 12px; background: var(--badge-bg); color: var(--badge-fg); font-weight: 700; font-size: 15px; }
.login-card button:disabled { opacity: .6; }
.login-err { margin: 0; color: var(--c-rose-fg); font-size: 13px; text-align: center; }
</style>
</head>

<div class="login" id="login" hidden>
  <form class="login-card" id="login-form">
    <img id="login-cat" alt="">
    <h2>なかちょタスク</h2>
    <label>メールアドレス<input id="login-email" type="email" autocomplete="email" required></label>
    <label>パスワード<input id="login-pass" type="password" autocomplete="current-password" required></label>
    <p class="login-err" id="login-err" hidden></p>
    <button id="login-btn">ログイン</button>
  </form>
</div>

<script type="module">
import { createClient } from "@supabase/supabase-js";
(() => {
  const KEY = "neko-tasks-v1";
  const COLORS = ["gray", "wood", "sage", "sky", "rose", "lemon"];
  const TYPES = [
    { id: "text",   label: "テキスト",   ico: "Aa" },
    { id: "check",  label: "チェック",   ico: "◯" },
    { id: "select", label: "選択肢",     ico: "▾" },
    { id: "date",   label: "日付",       ico: "◷" },
    { id: "number", label: "数値",       ico: "#" },
  ];
  const typeOf = id => TYPES.find(t => t.id === id) || TYPES[0];
  const uid = () => Math.random().toString(36).slice(2, 9);

  // ---------- 初期データ ----------
  function defaultCols() {
    return [
      { id: uid(), name: "完了", type: "check", width: 64 },
      { id: uid(), name: "タスク", type: "text", width: 300 },
      { id: uid(), name: "ステータス", type: "select", width: 140, options: [
        { id: uid(), label: "未着手", color: "gray" },
        { id: uid(), label: "進行中", color: "wood" },
        { id: uid(), label: "確認待ち", color: "sky" },
        { id: uid(), label: "完了", color: "sage" },
      ] },
      { id: uid(), name: "期限", type: "date", width: 150 },
      { id: uid(), name: "メモ", type: "text", width: 260 },
    ];
  }
  function newTab(name, rows) {
    const cols = defaultCols();
    const [cDone, cTask, cStatus, cDue, cMemo] = cols;
    const opt = l => cStatus.options.find(o => o.label === l)?.id || "";
    const r = (rows || [{}, {}, {}]).map(x => ({ id: uid(), cells: {
      [cDone.id]: !!x.done, [cTask.id]: x.task || "", [cStatus.id]: x.status ? opt(x.status) : "",
      [cDue.id]: x.due || "", [cMemo.id]: x.memo || "",
    } }));
    return { id: uid(), name, cols, rows: r };
  }

  function seed() {
    const a = newTab("OryLab"), b = newTab("PB");
    return { tabs: [a, b], active: a.id };
  }


  // ---------- 保存 ----------
  let state;
  try { state = JSON.parse(localStorage.getItem(KEY)); } catch (e) { state = null; }
  if (!state || !Array.isArray(state.tabs) || !state.tabs.length) state = seed();

  const savedEl = document.getElementById("saved");
  const showError = msg => { savedEl.textContent = msg; savedEl.hidden = !msg; };
  let saveTimer, localOk = true;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try { localStorage.setItem(KEY, JSON.stringify(state)); localOk = true; }
      catch (e) { localOk = false; }
      if (cloud) pushCloud();
      else showError(localOk ? "" : "このブラウザでは保存できませんでした");
    }, 250);
  }

  // ---------- パソコンとスマホで同じ内容にする ----------
  let cloud = null, lastSynced = null, writing = false, again = false, remotePending = null;
  async function pushCloud() {
    const body = JSON.stringify(state);
    if (body === lastSynced) return;
    if (writing) { again = true; return; }
    writing = true;
    try {
      await writeCloud(body);
      lastSynced = body; showError("");
    } catch (e) {
      showError("保存できませんでした。通信を確認してください");
    } finally {
      writing = false;
      if (again) { again = false; pushCloud(); }
    }
  }
  const isEditing = () => {
    const a = document.activeElement;
    return !!menuEl || !!(a && a.matches && a.matches("input, textarea"));
  };
  function applyRemote(body) {
    let next;
    try { next = JSON.parse(body); } catch (e) { return; }
    if (!next || !Array.isArray(next.tabs) || !next.tabs.length) return;
    const keepActive = state.active;
    state = next;
    if (state.tabs.some(t => t.id === keepActive)) state.active = keepActive;
    lastSynced = body;
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    render();
  }
  // 入力中に別の端末から更新が届いたら、入力が終わってから反映する
  document.addEventListener("focusout", () => setTimeout(() => {
    if (remotePending && !isEditing()) { const b = remotePending; remotePending = null; applyRemote(b); }
  }, 300));

  // Supabase（Web Archive と同じログイン）に保存する
  const SB_URL = import.meta.env.VITE_SUPABASE_URL, SB_KEY = import.meta.env.VITE_SUPABASE_PUBLISHABLE_KEY;
  const sb = SB_URL && SB_KEY ? createClient(SB_URL, SB_KEY) : null;
  let userId = null;
  const loginEl = document.getElementById("login");
  document.getElementById("login-cat").src = document.querySelector(".mascot img").src;

  async function pull() {
    if (!sb || !userId) return;
    const { data, error } = await sb.from("task_boards").select("state").eq("user_id", userId).maybeSingle();
    if (error) { showError("保存先につながりませんでした。少しして開き直してください"); return; }
    cloud = true; showError("");
    if (!data) { pushCloud(); return; }               // はじめて：今の内容を保存
    const body = JSON.stringify(data.state);
    if (body === lastSynced || body === JSON.stringify(state)) { lastSynced = body; return; }
    if (isEditing()) { remotePending = body; return; }
    applyRemote(body);
  }
  async function writeCloud(body) {
    const { error } = await sb.from("task_boards").upsert({ user_id: userId, state: JSON.parse(body), updated_at: new Date().toISOString() });
    if (error) throw error;
  }
  function onSession(session) {
    const next = session?.user?.id || null;
    loginEl.hidden = !!next;
    if (next && next !== userId) { userId = next; pull(); }
    if (!next) { userId = null; cloud = null; }
  }
  if (sb) {
    sb.auth.getSession().then(({ data }) => onSession(data.session));
    sb.auth.onAuthStateChange((_e, session) => onSession(session));
    // ほかの端末で書いた内容を、画面に戻ってきたときに取り込む
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") pull(); });
    window.addEventListener("focus", () => pull());
    document.getElementById("login-form").addEventListener("submit", async e => {
      e.preventDefault();
      const btn = document.getElementById("login-btn"), err = document.getElementById("login-err");
      btn.disabled = true; btn.textContent = "ログイン中…"; err.hidden = true;
      const { error } = await sb.auth.signInWithPassword({
        email: document.getElementById("login-email").value,
        password: document.getElementById("login-pass").value,
      });
      if (error) { err.textContent = "メールアドレスかパスワードが違います"; err.hidden = false; }
      btn.disabled = false; btn.textContent = "ログイン";
    });
  }

  const tab = () => state.tabs.find(t => t.id === state.active) || state.tabs[0];

  // ---------- 小物 ----------
  function el(tag, props = {}, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else if (k === "style") n.setAttribute("style", v);
      else if (v !== undefined && v !== null && v !== false) n.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids.flat()) if (k != null) n.append(k);
    return n;
  }

  // ---------- メニュー ----------
  let menuEl = null, menuCleanup = null;
  function closeMenu() {
    if (menuEl) { menuEl.remove(); menuEl = null; }
    if (menuCleanup) { menuCleanup(); menuCleanup = null; }
  }
  function openMenu(anchor, build) {
    closeMenu();
    const m = el("div", { class: "menu", role: "menu" });
    build(m);
    document.body.append(m);
    const r = anchor.getBoundingClientRect();
    const mw = m.offsetWidth, mh = m.offsetHeight;
    let x = Math.min(r.left, window.innerWidth - mw - 12);
    let y = r.bottom + 6;
    if (y + mh > window.innerHeight - 12) y = Math.max(12, r.top - mh - 6);
    m.style.left = Math.max(12, x) + "px"; m.style.top = y + "px";
    menuEl = m;
    const onDown = e => { if (!m.contains(e.target) && !anchor.contains(e.target)) closeMenu(); };
    const onKey = e => { if (e.key === "Escape") { closeMenu(); anchor.focus?.(); } };
    setTimeout(() => {
      document.addEventListener("pointerdown", onDown);
      document.addEventListener("keydown", onKey);
    });
    menuCleanup = () => {
      document.removeEventListener("pointerdown", onDown);
      document.removeEventListener("keydown", onKey);
    };
    const first = m.querySelector("input, button");
    first?.focus();
    return m;
  }
  function mi(ico, label, onclick, cls = "") {
    return el("button", { class: "mi " + cls, type: "button", onclick }, el("span", { class: "ico", text: ico }), el("span", { text: label }));
  }
  // 2回押して確定する削除ボタン
  function dangerItem(label, confirmLabel, action) {
    const b = mi("×", label, () => {
      if (b.classList.contains("armed")) { action(); closeMenu(); }
      else { b.classList.add("armed"); b.lastChild.textContent = confirmLabel; }
    }, "danger");
    return b;
  }

  // ---------- タブ ----------
  const tabsEl = document.getElementById("tabs");
  let dragTabId = null;

  function countDone(t) {
    const c = t.cols.find(c => c.type === "check");
    if (!c) return null;
    const filled = t.rows.filter(r => Object.entries(r.cells).some(([k, v]) => k !== c.id && v !== "" && v !== false && v != null));
    return { done: filled.filter(r => r.cells[c.id]).length, total: filled.length };
  }

  function renderTabs() {
    tabsEl.replaceChildren();
    for (const t of state.tabs) {
      const active = t.id === state.active;
      const cnt = countDone(t);
      const b = el("button", {
        class: "tab" + (active ? " active" : ""), type: "button", draggable: "true",
        "aria-current": active ? "page" : null, 
        onclick: e => {
          if (e.target.closest(".more")) return;
          if (!active) { state.active = t.id; save(); render(); }
        },
        ondblclick: () => startRename(t, b),
        oncontextmenu: e => { e.preventDefault(); tabMenu(t, b); },
        ondragstart: e => { dragTabId = t.id; b.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; },
        ondragend: () => { dragTabId = null; renderTabs(); },
        ondragover: e => { if (dragTabId && dragTabId !== t.id) { e.preventDefault(); b.classList.add("drop-before"); } },
        ondragleave: () => b.classList.remove("drop-before"),
        ondrop: e => {
          e.preventDefault();
          const from = state.tabs.findIndex(x => x.id === dragTabId);
          if (from < 0) return;
          const [moved] = state.tabs.splice(from, 1);
          const to = state.tabs.findIndex(x => x.id === t.id);
          state.tabs.splice(to, 0, moved);
          save(); renderTabs();
        },
      },
        el("span", { text: t.name || "名前なし" }),
        cnt && cnt.total - cnt.done > 0 ? el("span", { class: "count",  text: String(cnt.total - cnt.done) }) : null,
        active ? el("span", { class: "more", role: "button", "aria-label": "タブのメニュー", text: "⋯",
          onclick: e => { e.stopPropagation(); tabMenu(t, b); } }) : null,
      );
      tabsEl.append(b);
    }
    tabsEl.append(el("button", { class: "add-tab", type: "button", "aria-label": "タブを追加",  text: "+",
      onclick: () => {
        const t = newTab("新しいタブ");
        state.tabs.push(t); state.active = t.id; save(); render();
        const btn = tabsEl.querySelector(".tab.active");
        startRename(t, btn);
      } }));
  }

  function startRename(t, btn) {
    const input = el("input", { class: "tab-rename", type: "text", "aria-label": "タブ名" });
    input.value = t.name;
    btn.replaceWith(input);
    input.focus(); input.select();
    let done = false;
    const finish = ok => {
      if (done) return; done = true;
      if (ok && input.value.trim()) { t.name = input.value.trim(); save(); }
      renderTabs();
    };
    input.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.isComposing) finish(true);
      if (e.key === "Escape") finish(false);
    });
    input.addEventListener("blur", () => finish(true));
  }

  function tabMenu(t, btn) {
    openMenu(btn, m => {
      m.classList.add("compact");
      m.append(
        mi("✎", "名前を変更", () => { closeMenu(); startRename(t, tabsEl.querySelector(".tab.active") || btn); }),
        mi("⧉", "タブを複製", () => {
          const copy = JSON.parse(JSON.stringify(t));
          copy.id = userId(); copy.name = t.name + " のコピー";
          state.tabs.splice(state.tabs.indexOf(t) + 1, 0, copy);
          state.active = copy.id; save(); closeMenu(); render();
        }),
      );
      if (state.tabs.length > 1) {
        m.append(el("hr"), dangerItem("タブを削除", "もう一度押すと削除します", () => {
          const i = state.tabs.indexOf(t);
          state.tabs.splice(i, 1);
          state.active = state.tabs[Math.max(0, i - 1)].id;
          save(); render();
        }));
      }
    });
  }

  // ---------- 表 ----------
  const sheetEl = document.getElementById("sheet");

  function renderSheet(focus) {
    const t = tab();
    const same = sheetEl.dataset.tab === t.id;
    sheetEl.dataset.tab = t.id;
    const scrollTop = same ? sheetEl.querySelector(".scroller")?.scrollTop || 0 : 0;
    const scrollLeft = same ? sheetEl.querySelector(".scroller")?.scrollLeft || 0 : 0;
    sheetEl.replaceChildren();

    const colgroup = el("colgroup", {},
      el("col", { style: "width:46px" }),
      t.cols.map(c => el("col", { style: `width:${c.width || 160}px` })),
      el("col", { style: "width:52px" }),
    );

    const headRow = el("tr", {}, el("th", { class: "gutter" }));
    t.cols.forEach((c, ci) => {
      const head = el("button", { class: "col-head", type: "button", onclick: () => colMenu(t, c, head) },
        el("span", { class: "ico", text: typeOf(c.type).ico }),
        el("span", { class: "nm", text: c.name || "無題" }));
      const handle = el("span", { class: "resize", "aria-hidden": "true" });
      handle.addEventListener("pointerdown", e => startResize(e, t, c, handle, ci));
      headRow.append(el("th", {}, head, handle));
    });
    headRow.append(el("th", { class: "add-col-th" },
      el("button", { class: "add-col", type: "button",  "aria-label": "列を追加", text: "+",
        onclick: () => {
          const c = { id: userId(), name: "新しい列", type: "text", width: 160 };
          t.cols.push(c); save(); renderSheet();
          const heads = sheetEl.querySelectorAll(".col-head");
          colMenu(t, c, heads[heads.length - 1], true);
        } })));

    const body = el("tbody");
    const checkCol = t.cols.find(c => c.type === "check");
    t.rows.forEach((r, ri) => {
      const tr = el("tr", { class: checkCol && r.cells[checkCol.id] ? "done" : "" });
      tr.append(el("td", { class: "gutter" },
        el("span", { class: "row-num", text: ri + 1 }),
        el("button", { class: "row-del", type: "button",  "aria-label": `${ri + 1}行目を削除`, text: "×",
          onclick: () => { t.rows.splice(ri, 1); save(); renderSheet(); renderTabs(); } })));
      t.cols.forEach((c, ci) => tr.append(el("td", {}, cellEl(t, r, c, ri, ci))));
      tr.append(el("td"));
      body.append(tr);
    });

    const table = el("table", {}, colgroup, el("thead", {}, headRow), body);
    const scroller = el("div", { class: "scroller" }, table);
    const foot = el("div", { class: "foot" },
      el("button", { class: "btn-soft", type: "button", onclick: () => addRow(t, true) }, el("span", { text: "+" }), "行を追加"),
      el("span", { class: "hint", text: "Enter で下の行へ ・ 列名を押すと種類や並べ替え" }));
    sheetEl.append(scroller, foot);
    scroller.scrollTop = scrollTop; scroller.scrollLeft = scrollLeft;

    if (focus) {
      const target = sheetEl.querySelector(`[data-r="${focus.r}"][data-c="${focus.c}"]`);
      target?.focus();
    }
  }

  function addRow(t, focusIt, at) {
    const r = { id: userId(), cells: {} };
    const idx = at == null ? t.rows.length : at;
    t.rows.splice(idx, 0, r);
    save();
    const firstText = t.cols.findIndex(c => c.type === "text");
    renderSheet(focusIt ? { r: idx, c: Math.max(0, firstText) } : null);
    if (focusIt) sheetEl.querySelector(".scroller").scrollTop = 1e6;
  }

  function moveFocus(ri, ci) {
    const t = tab();
    if (ri < 0) return;
    if (ri >= t.rows.length) { addRow(t, false); }
    const target = sheetEl.querySelector(`[data-r="${ri}"][data-c="${ci}"]`);
    target?.focus();
    if (target?.select && target.type === "text") target.select();
  }

  function navKeys(e, ri, ci, isText) {
    if (e.isComposing) return;
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); moveFocus(ri + 1, ci); }
    else if (e.key === "Enter" && e.shiftKey) { e.preventDefault(); moveFocus(ri - 1, ci); }
    else if (e.key === "ArrowDown") { e.preventDefault(); moveFocus(ri + 1 >= tab().rows.length ? ri : ri + 1, ci); }
    else if (e.key === "ArrowUp") { e.preventDefault(); moveFocus(ri - 1, ci); }
    else if (!isText && e.key === "ArrowRight") { e.preventDefault(); moveFocus(ri, Math.min(ci + 1, tab().cols.length - 1)); }
    else if (!isText && e.key === "ArrowLeft") { e.preventDefault(); moveFocus(ri, Math.max(ci - 1, 0)); }
    else if (isText && e.key === "ArrowRight" && e.target.selectionStart === e.target.value.length && e.target.selectionEnd === e.target.value.length) {
      e.preventDefault(); moveFocus(ri, Math.min(ci + 1, tab().cols.length - 1));
    }
    else if (isText && e.key === "ArrowLeft" && e.target.selectionStart === 0 && e.target.selectionEnd === 0) {
      e.preventDefault(); moveFocus(ri, Math.max(ci - 1, 0));
    }
  }

  function cellEl(t, r, c, ri, ci) {
    const v = r.cells[c.id];
    const pos = { "data-r": ri, "data-c": ci };
    if (c.type === "check") {
      const b = el("button", { class: "cell-check", type: "button", role: "checkbox", "aria-checked": v ? "true" : "false", "aria-label": c.name, ...pos,
        onclick: () => { r.cells[c.id] = !r.cells[c.id]; save(); renderSheet({ r: ri, c: ci }); renderTabs(); },
        onkeydown: e => { if (e.key === " ") return; navKeys(e, ri, ci, false); } },
        el("span", { class: "check" + (v ? " on" : "") }));
      return b;
    }
    if (c.type === "select") {
      const opt = (c.options || []).find(o => o.id === v);
      const b = el("button", { class: "cell-select", type: "button", "aria-label": c.name, ...pos,
        onclick: () => selectMenu(t, r, c, b, ri, ci),
        onkeydown: e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); selectMenu(t, r, c, b, ri, ci); return; } navKeys(e, ri, ci, false); } },
        opt ? el("span", { class: "pill " + opt.color, text: opt.label }) : el("span", { class: "empty-dash", text: "—" }));
      return b;
    }
    if (c.type === "date") {
      const i = el("input", { class: "cell-date" + (v ? " has" : ""), type: "date", "aria-label": c.name, ...pos });
      i.value = v || "";
      i.addEventListener("change", () => { r.cells[c.id] = i.value; i.classList.toggle("has", !!i.value); save(); });
      i.addEventListener("keydown", e => { if (["Enter", "ArrowUp", "ArrowDown"].includes(e.key)) { if (e.key !== "Enter") return; navKeys(e, ri, ci, false); } });
      return i;
    }
    const isNum = c.type === "number";
    const i = el("input", { class: isNum ? "cell-num" : "cell-text", type: "text", inputmode: isNum ? "decimal" : null, "aria-label": c.name, ...pos });
    i.value = v ?? "";
    i.addEventListener("input", () => {
      r.cells[c.id] = i.value; save();
      if (c.type === "text") renderTabsSoon();
    });
    i.addEventListener("keydown", e => navKeys(e, ri, ci, true));
    return i;
  }
  let tabsSoon;
  const renderTabsSoon = () => { clearTimeout(tabsSoon); tabsSoon = setTimeout(renderTabs, 400); };

  function selectMenu(t, r, c, anchor, ri, ci) {
    c.options = c.options || [];
    openMenu(anchor, m => {
      const input = el("input", { type: "text", placeholder: "選択肢を探す・追加する", "aria-label": "選択肢を探す・追加する" });
      const list = el("div", { style: "display:flex;flex-direction:column;gap:2px" });
      const pick = id => { r.cells[c.id] = id; save(); closeMenu(); renderSheet({ r: ri, c: ci }); };
      const draw = () => {
        list.replaceChildren();
        const q = input.value.trim();
        const shown = c.options.filter(o => !q || o.label.includes(q));
        for (const o of shown) {
          const b = el("button", { class: "mi" + (r.cells[c.id] === o.id ? " sel" : ""), type: "button", onclick: e => {
            if (e.target.closest(".x")) return;
            pick(o.id);
          } },
            el("span", { class: "pill " + o.color, text: o.label }),
            el("span", { class: "x", role: "button",  "aria-label": `${o.label} を消す`, text: "×",
              onclick: () => {
                c.options = c.options.filter(x => x.id !== o.id);
                t.rows.forEach(row => { if (row.cells[c.id] === o.id) row.cells[c.id] = ""; });
                save(); draw(); renderSheet();
              } }));
          list.append(b);
        }
        if (q && !c.options.some(o => o.label === q)) {
          list.append(mi("+", `「${q}」を追加`, () => addOpt(q)));
        }
        if (!shown.length && !q) list.append(el("div", { class: "sec", text: "上の欄に入力して Enter で追加できます" }));
      };
      const addOpt = label => {
        const o = { id: userId(), label, color: COLORS[c.options.length % COLORS.length] };
        c.options.push(o); pick(o.id);
      };
      input.addEventListener("input", draw);
      input.addEventListener("keydown", e => {
        if (e.key !== "Enter" || e.isComposing) return;
        const q = input.value.trim(); if (!q) return;
        const hit = c.options.find(o => o.label === q) || c.options.find(o => o.label.includes(q));
        hit ? pick(hit.id) : addOpt(q);
      });
      draw();
      m.append(input, list);
      if (r.cells[c.id]) m.append(el("hr"), mi("○", "選択をはずす", () => pick("")));
    });
  }

  function colMenu(t, c, anchor, freshName) {
    openMenu(anchor, m => {
      const name = el("input", { type: "text", "aria-label": "列の名前" });
      name.value = c.name;
      name.addEventListener("input", () => {
        c.name = name.value; save();
        const nm = anchor.querySelector(".nm"); if (nm) nm.textContent = c.name || "無題";
      });
      name.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) closeMenu(); });
      m.append(name);
      if (freshName) setTimeout(() => name.select());

      m.append(el("div", { class: "sec", text: "種類" }));
      const types = el("div", { class: "types" });
      for (const ty of TYPES) {
        types.append(mi(ty.ico, ty.label, () => { changeType(t, c, ty.id); closeMenu(); renderSheet(); renderTabs(); }, c.type === ty.id ? "sel" : ""));
      }
      m.append(types, el("hr"));

      const idx = t.cols.indexOf(c);
      m.append(...[
        mi("↑", "昇順で並べ替え", () => { sortBy(t, c, 1); closeMenu(); }),
        mi("↓", "降順で並べ替え", () => { sortBy(t, c, -1); closeMenu(); }),
        el("hr"),
        mi("←", "左に列を追加", () => { insertCol(t, idx); }),
        mi("→", "右に列を追加", () => { insertCol(t, idx + 1); }),
        idx > 0 ? mi("‹", "左へ移動", () => { t.cols.splice(idx, 1); t.cols.splice(idx - 1, 0, c); save(); closeMenu(); renderSheet(); }) : null,
        idx < t.cols.length - 1 ? mi("›", "右へ移動", () => { t.cols.splice(idx, 1); t.cols.splice(idx + 1, 0, c); save(); closeMenu(); renderSheet(); }) : null,
      ].filter(Boolean));
      if (t.cols.length > 1) {
        m.append(el("hr"), dangerItem("列を削除", "もう一度押すと削除します", () => {
          t.cols.splice(t.cols.indexOf(c), 1);
          t.rows.forEach(r => delete r.cells[c.id]);
          save(); renderSheet(); renderTabs();
        }));
      }
    });
  }

  function insertCol(t, at) {
    const c = { id: userId(), name: "新しい列", type: "text", width: 160 };
    t.cols.splice(at, 0, c); save(); closeMenu(); renderSheet();
    colMenu(t, c, sheetEl.querySelectorAll(".col-head")[at], true);
  }

  function changeType(t, c, to) {
    const from = c.type;
    if (from === to) return;
    const display = r => {
      const v = r.cells[c.id];
      if (from === "check") return v ? "✓" : "";
      if (from === "select") return (c.options || []).find(o => o.id === v)?.label || "";
      return v == null ? "" : String(v);
    };
    const vals = t.rows.map(display);
    if (to === "select") {
      const opts = [];
      vals.forEach(s => { if (s && !opts.some(o => o.label === s)) opts.push({ id: userId(), label: s, color: COLORS[opts.length % COLORS.length] }); });
      if (from !== "select") c.options = opts.length ? opts : (c.options || []);
      t.rows.forEach((r, i) => { r.cells[c.id] = c.options.find(o => o.label === vals[i])?.id || ""; });
    } else if (to === "check") {
      t.rows.forEach((r, i) => { r.cells[c.id] = !!vals[i] && !["0", "false", "いいえ", "未"].includes(vals[i]); });
    } else if (to === "date") {
      t.rows.forEach((r, i) => { r.cells[c.id] = /^\d{4}-\d{2}-\d{2}$/.test(vals[i]) ? vals[i] : ""; });
    } else {
      t.rows.forEach((r, i) => { r.cells[c.id] = vals[i]; });
    }
    c.type = to;
    if (to === "check" && (c.width || 0) > 120) c.width = 72;
    if (from === "check" && (c.width || 0) < 120) c.width = 160;
    save();
  }

  function sortBy(t, c, dir) {
    const key = r => {
      const v = r.cells[c.id];
      if (c.type === "check") return v ? 1 : 0;
      if (c.type === "select") { const i = (c.options || []).findIndex(o => o.id === v); return i < 0 ? Infinity : i; }
      if (c.type === "number") { const n = parseFloat(v); return isNaN(n) ? Infinity : n; }
      return v ? String(v) : null;
    };
    t.rows.sort((a, b) => {
      const x = key(a), y = key(b);
      if (x === y) return 0;
      if (x === null || x === Infinity) return 1;   // 空は常に下
      if (y === null || y === Infinity) return -1;
      return (typeof x === "string" ? x.localeCompare(y, "ja") : x - y) * dir;
    });
    save(); renderSheet();
  }

  function startResize(e, t, c, handle, ci) {
    e.preventDefault();
    const startX = e.clientX, startW = c.width || 160;
    const col = sheetEl.querySelectorAll("col")[ci + 1];
    handle.classList.add("on");
    handle.setPointerCapture(e.pointerId);
    const move = ev => { c.width = Math.max(56, Math.round(startW + ev.clientX - startX)); col.style.width = c.width + "px"; };
    const up = () => { handle.classList.remove("on"); handle.removeEventListener("pointermove", move); handle.removeEventListener("pointerup", up); save(); };
    handle.addEventListener("pointermove", move);
    handle.addEventListener("pointerup", up);
  }

  function render() { closeMenu(); renderTabs(); renderSheet(); }
  window.addEventListener("resize", closeMenu);
  render();
})();
</script>
</body>
</html>
